<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000"><title>Ludo Arena — Online</title>
<link rel="stylesheet" href="style.css"><link rel="stylesheet" href="ludo.css">
</head>
<body><div class="backdrop" aria-hidden="true"></div>
<main class="app ludo-app">
<header class="topbar"><a class="brand ludo-brand" href="./" aria-label="Back to TicTacToe Arena"><span class="brand-x">L</span><span class="brand-o">🎲</span><span class="brand-name">Ludo Arena</span></a><div id="ludoNet" class="net" data-state="connecting"><span class="dot"></span><span id="ludoNetText">Connecting</span></div></header>
<section class="panel ludo-lobby" id="ludoLobby">
<h1 class="headline">Roll the dice.<br><span class="ludo-gradient">Rule the board.</span></h1>
<p class="lede">Online Ludo for 2–4 friends. Create a room and share the six-character code.</p>
<button id="ludoCreate" class="btn btn-primary" type="button" disabled>Create Ludo room</button>
<div class="or"><span>or join a friend</span></div>
<form id="ludoJoinForm" class="join"><label class="sr-only" for="ludoCode">Room code</label><input id="ludoCode" class="code-input" maxlength="6" placeholder="Ludo room code" autocomplete="off" autocapitalize="characters" required disabled><button id="ludoJoin" class="btn btn-secondary" type="submit" disabled>Join room</button></form>
<p id="ludoMessage" class="msg" role="status" aria-live="polite"></p>
<a class="btn btn-ghost ludo-back" href="./">← Back to TicTacToe</a>
</section>
<section class="panel ludo-game" id="ludoGame" hidden>
<div class="room-bar"><button id="ludoCopyCode" class="code-chip" type="button"><span class="code-label">Ludo room</span><span id="ludoRoomCode" class="code-value">------</span></button><button id="ludoCopyLink" class="btn btn-ghost btn-sm" type="button">Copy invite link</button></div>
<div class="ludo-statusline"><div id="ludoStatus" class="status" data-kind="wait"><span class="dot"></span><span id="ludoStatusText">Waiting for players</span></div><span id="ludoPlayerCount" class="ludo-count">0 / 4 PLAYERS</span></div>
<div class="ludo-layout"><div class="ludo-board-wrap"><div id="ludoBoard" class="ludo-board" aria-label="Ludo board"></div></div>
<aside class="ludo-side"><div class="ludo-dice-card"><div class="eyebrow">CURRENT TURN</div><div id="ludoTurn" class="ludo-turn">Waiting…</div><button id="ludoRoll" class="ludo-dice" type="button" disabled aria-label="Roll dice"><span id="ludoDie">⚄</span></button><p id="ludoHint" class="ludo-hint">Waiting for players to join.</p></div><div class="ludo-players" id="ludoPlayers"></div><p id="ludoFeedback" class="ludo-feedback" aria-live="polite"></p><button id="ludoLeave" class="btn btn-danger" type="button">Leave room</button></aside></div>
</section>
</main><div id="ludoToast" class="toast" role="status" aria-live="polite"></div>
<script type="module" src="ludo.js"></script></body></html>
